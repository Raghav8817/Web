<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mahakal Travels</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="shortcut icon" href="logo-tra.png" type="image/x-icon">
    <style>
        #splash {
            position: fixed;
            width: 100%;
            height: 100vh;
            background: black;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }

        #splash img {
            width: 250px;
        }

        #mainContent {
            display: none;
        }
    </style>
</head>

<body class="bg-gray-100 font-sans">

    <!-- Splash Screen -->
    <div id="splash">
        <img src="logo-tra.ico" alt="Mahakal Travels Logo">
    </div>

    <!-- Main Website -->
    <div id="mainContent">

        <!-- Header -->
        <header class="bg-blue-600 text-white p-4 text-center shadow-lg">
            <h1 class="text-2xl font-bold">Mahakal Travels</h1>
            <p class="text-sm">Safe & Comfortable Travel Service</p>
        </header>

        <!-- Hero Section -->
        <section class="p-4 text-center">
            <h2 class="text-xl font-semibold mb-2">Book Your Ride Anytime</h2>
            <p class="text-gray-600 mb-4">Comfortable and reliable travel service in your city</p>

            <a href="https://wa.me/917415474851"
                class="bg-green-500 text-white px-6 py-3 rounded-full shadow-lg text-lg">
                WhatsApp / Call Now
            </a>
        </section>

        <!-- Address -->
        <section class="bg-white m-4 p-4 rounded-2xl shadow">
            <h3 class="text-lg font-bold mb-2">Our Address</h3>
            <p>Lajpat Kunj</p>
            <p class="text-sm text-gray-500">Phone: 7415474851</p>
        </section>

        <!-- Cars Section -->
        <section class="p-4">
            <h3 class="text-lg font-bold mb-4 text-center">Available Cars</h3>

            <!-- Scorpio -->
            <div class="bg-white rounded-2xl shadow mb-4 p-3">
                <img src="scorpio.avif" class="rounded-xl" />
                <h4 class="text-lg font-semibold mt-2">Scorpio S11</h4>
            </div>

            <!-- Innova -->
            <div class="bg-white rounded-2xl shadow mb-4 p-3">
                <img src="innova.avif" class="rounded-xl" />
                <h4 class="text-lg font-semibold mt-2">Innova Crysta</h4>
            </div>

            <!-- Ertiga -->
            <div class="bg-white rounded-2xl shadow mb-4 p-3">
                <img src="ertiga.avif" class="rounded-xl" />
                <h4 class="text-lg font-semibold mt-2">Ertiga</h4>
            </div>

            <!-- Dzire -->
            <div class="bg-white rounded-2xl shadow mb-4 p-3">
                <img src="desire.webp" class="rounded-xl" />
                <h4 class="text-lg font-semibold mt-2">Dzire</h4>
            </div>
        </section>

        <!-- WhatsApp Floating Button -->
        <a href="https://wa.me/917415474851"
            class="fixed bottom-5 right-5 bg-green-500 text-white px-5 py-3 rounded-full shadow-lg">
            Book Now
        </a>

        <!-- Footer -->
        <footer class="bg-blue-600 text-white text-center p-3 mt-6">
            <p>© 2026 Mahakal Travels</p>
        </footer>

    </div>

    <!-- Script -->
    <script>
        setTimeout(() => {
            document.getElementById("splash").style.display = "none";
            document.getElementById("mainContent").style.display = "block";
        }, 1500);
    </script>

</body>

</html>
